name: One-shot verify original upstream source selection
on:
  push:
    branches: ['research/original-paperbanana-review-20261103']
permissions:
  contents: read
jobs:
  original-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 1666435857d3805c333c64f651d3fc4403144596
          persist-credentials: false
      - name: Verify original upstream and protected fork
        shell: bash
        run: |
          set -euo pipefail
          python research-figure/scripts/upstreams.py check --kernel design --allow-network > original-result.json
          python -c "import json; d=json.load(open('original-result.json')); r=d['results'][0]; assert d['status']=='COMPLETE'; assert r['source_role']=='original'; assert r['source_repository']=='https://github.com/dwzhu-pku/PaperBanana'; assert r['to_revision']=='dafc2d41c10395c8bc37faad26836070fef0add8'; assert 'installed_diff' in r and 'diff' in r; print('Original fetch PASS')"
          set +e
          python research-figure/scripts/upstreams.py pull --kernel design --allow-network > blocked-pull.json
          status=$?
          set -e
          test "$status" -eq 2
          python -c "import json; d=json.load(open('blocked-pull.json')); assert d['status']=='BLOCKED_OR_PARTIAL'; assert 'protected fork-only' in d.get('error',''); print('Fork protection PASS')"
          python research-figure/scripts/upstreams.py verify >/dev/null
