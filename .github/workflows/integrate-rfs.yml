name: Verify RFS clean release checkout
on:
  push:
    branches: ['integration/rfs-kernels-v0.8.0']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PAPERBANANA_ROOT: ${{ github.workspace }}/research-figure/kernels/design
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 5f30d0f91cec82e05d753f59730cd4a4cfb2d4a0
          persist-credentials: false
      - name: Verify exact release source tree
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = '5f30d0f91cec82e05d753f59730cd4a4cfb2d4a0'
          test "$(git rev-parse 'HEAD^{tree}')" = 'c600c15b2c56209b00d0349c5a57d06ddc786c1c'
          mkdir -p "$RUNNER_TEMP/release-checks"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -r research-figure/requirements-exchange.txt -r research-figure/requirements-plot.txt -r research-figure/requirements-native-qa.txt PyYAML
      - name: Official Agent Skills validator
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          set -o pipefail
          python -m pip install "git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
          skills-ref validate research-figure | tee "$RUNNER_TEMP/release-checks/skills-ref.log"
      - name: Package and tracked-source integrity
        shell: bash
        run: |
          set -o pipefail
          python research-figure/scripts/check_skill.py
          python research-figure/scripts/upstreams.py verify | tee "$RUNNER_TEMP/release-checks/upstream-integrity.json"
          python research-figure/scripts/check_repository.py --root . --tracked
      - name: Complete regression suite
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s research-figure/tests -v 2>&1 | tee "$RUNNER_TEMP/release-checks/tests-${{ matrix.python-version }}.log"
      - name: Actual offline kernel execution
        shell: bash
        run: |
          set -o pipefail
          python research-figure/scripts/smoke_kernels.py | tee "$RUNNER_TEMP/release-checks/offline-smoke.json"
      - name: Complete installable package
        shell: bash
        run: |
          set -o pipefail
          python research-figure/scripts/build_package.py --out "$RUNNER_TEMP/release-checks/research-figure-0.8.0.zip" | tee "$RUNNER_TEMP/release-checks/package.json"
          sha256sum "$RUNNER_TEMP/release-checks/research-figure-0.8.0.zip"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rfs-clean-release-${{ matrix.python-version }}
          path: ${{ runner.temp }}/release-checks/
          if-no-files-found: warn
          retention-days: 14
